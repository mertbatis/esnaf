<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Şeker Pastanesi · İzmir</title><meta name="description" content="Şeker Pastanesi: Özel gün pastanızı şimdiden ayırtın">
<style>:root{--c:#be185d}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,"Segoe UI",sans-serif;color:#1f2430;background:#f6f6f9}
.hero{background:linear-gradient(135deg,var(--c),#111827);color:#fff;padding:42px 22px 34px;text-align:center}.hero small{opacity:.85;letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.hero h1{margin:8px 0 6px;font-size:34px;line-height:1.1}.hero p{margin:0 0 20px;opacity:.92}.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:15px}.wa{background:#25d366;color:#05310f}.wh{background:#fff;color:#111827}
main{max-width:720px;margin:-18px auto 0;padding:0 14px 40px}.card{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.07);padding:20px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:19px}.it{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #eee;cursor:pointer}.it .n{flex:1}.it .f{font-weight:700;color:var(--c)}
.q{display:none;align-items:center;gap:8px}.it.on .q{display:flex}.q button{width:28px;height:28px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:16px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--c)}select,input[type=date],input[type=text]{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit;margin:6px 0 10px}
.send{width:100%;justify-content:center;font-size:17px;padding:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info p{margin:6px 0}
footer{text-align:center;font-size:12px;color:#888;padding:10px 0 30px}.demo{background:#fef3c7;color:#92400e;text-align:center;font-size:13px;padding:6px}</style></head><body>
<div class="demo">Örnek tasarım: içerik ve fiyatlar temsilidir, sizinle birlikte güncellenir.</div>
<header class="hero"><small>Pastane · İzmir</small><h1>Şeker Pastanesi</h1><p>Özel gün pastanızı şimdiden ayırtın</p>
<div class="btns"><a class="b wh" href="https://www.google.com/maps/search/?api=1&query=%C5%9Eeker%20Pastanesi%20%C4%B0zmir" target="_blank" rel="noopener">Yol tarifi</a></div></header>
<main>
<section class="card"><h2>Sipariş verin</h2><label class="it"><input type="checkbox" data-i="0" data-ad="Yaş pasta (8 kişilik)" data-f="1100"><span class="n">Yaş pasta (8 kişilik)</span><span class="f">1.100 ₺</span><span class="q"><button type="button" class="m">−</button><b>1</b><button type="button" class="p">+</button></span></label><label class="it"><input type="checkbox" data-i="1" data-ad="Profiterol" data-f="220"><span class="n">Profiterol</span><span class="f">220 ₺</span><span class="q"><button type="button" class="m">−</button><b>1</b><button type="button" class="p">+</button></span></label><label class="it"><input type="checkbox" data-i="2" data-ad="Ekler (kg)" data-f="650"><span class="n">Ekler (kg)</span><span class="f">650 ₺</span><span class="q"><button type="button" class="m">−</button><b>1</b><button type="button" class="p">+</button></span></label><label class="it"><input type="checkbox" data-i="3" data-ad="Baklava (kg)" data-f="1400"><span class="n">Baklava (kg)</span><span class="f">1.400 ₺</span><span class="q"><button type="button" class="m">−</button><b>1</b><button type="button" class="p">+</button></span></label><label class="it"><input type="checkbox" data-i="4" data-ad="Kurabiye (kg)" data-f="450"><span class="n">Kurabiye (kg)</span><span class="f">450 ₺</span><span class="q"><button type="button" class="m">−</button><b>1</b><button type="button" class="p">+</button></span></label>
<label style="display:block;margin-top:12px">Adres / not<input type="text" id="not" placeholder="Teslimat adresi ya da masa numarası"></label>
<label>Adınız<input type="text" id="kim" placeholder="Adınız soyadınız"></label>
<button class="b wa send" id="gonder">WhatsApp ile siparişi gönder</button></section>
<section class="card info"><h2>Bilgi</h2><p>🕘 Her gün 09:00 – 21:00</p></section>
</main><footer>Şeker Pastanesi · 2026</footer>
<script>
const WA=null;const MOD="siparis";
document.querySelectorAll('.it').forEach(l=>{const c=l.querySelector('input');c.addEventListener('change',()=>l.classList.toggle('on',c.checked));l.querySelectorAll('.q button').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const n=l.querySelector('.q b');let v=+n.textContent+(b.classList.contains('p')?1:-1);n.textContent=Math.max(1,v);}));});
document.getElementById('gonder').onclick=()=>{const s=[...document.querySelectorAll('.it.on')].map(l=>{const i=l.querySelector('input');const q=l.querySelector('.q b');return (q?q.textContent+' x ':'')+i.dataset.ad;});
if(!s.length){alert('Lütfen en az bir seçim yapın.');return;}const kim=document.getElementById('kim').value;
let m=(MOD==='siparis'?'Merhaba, sipariş vermek istiyorum:\n':'Merhaba, randevu almak istiyorum:\n')+s.map(x=>'• '+x).join('\n');
if(MOD==='randevu'){m+='\nGün: '+(document.getElementById('gun').value||'en yakın uygun gün')+'\nSaat: '+document.getElementById('saat').value;}else{const n=document.getElementById('not').value;if(n)m+='\nNot: '+n;}
if(kim)m+='\nAd: '+kim;const u=WA?'https://wa.me/'+WA+'?text='+encodeURIComponent(m):'sms:?body='+encodeURIComponent(m);window.open(u,'_blank');};
</script></body></html>
